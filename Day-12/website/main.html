<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Zero To Hero</title>
    <style>
        /* General Reset and Body Styling */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111a24; /* Dark blue/gray background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Card Container */
        .card {
            background-color: #1a2332; /* Slightly lighter card background */
            border: 1px solid #2a3749;
            border-radius: 12px;
            padding: 40px;
            max-width: 650px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Orange Kicker Text */
        .kicker {
            color: #f2903d; 
            font-size: 14px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Main Title */
        .title {
            color: #ffffff;
            font-size: 42px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Subtitle / Day text */
        .subtitle {
            color: #e2e8f0;
            font-size: 15px;
            margin-bottom: 16px;
        }

        /* Description text */
        .description {
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Green Badge */
        .badge {
            background-color: #0d7846; /* Dark green */
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px; /* Pill shape */
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">AWS learning journey</h1>
        <p class="subtitle">Day 12: Native S3 Website</p>
        <p class="description">This is a synthetic single-page HTML object created for a private S3 training demonstration.</p>
        <div class="badge">S3 practical ready</div>
    </div>

</body>
</html>
